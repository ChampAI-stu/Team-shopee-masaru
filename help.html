<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิธีใช้งาน · MASARU Shopee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.doc{font-size:14px;line-height:1.85}
.doc h4{font-family:'Anuphan';font-size:15px;font-weight:700;margin:22px 0 8px}
.doc h4:first-child{margin-top:0}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 12px;padding-left:20px}
.doc li{margin-bottom:5px}
.doc table{margin:6px 0 16px;font-size:13px}
.doc thead th{cursor:default;position:static}
.doc code{background:var(--blue-soft);color:var(--navy);padding:1px 6px;border-radius:5px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 44px;border-left:2px solid var(--line);margin-left:14px}
.steps li:last-child{border-left-color:transparent;padding-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:-15px;top:0;width:28px;height:28px;border-radius:50%;
  background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.steps li b{display:block;font-family:'Anuphan';font-size:14.5px;margin-bottom:2px}
.sheetdemo{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:2;background:#FAFBFD;
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 12px}
.sheetdemo .no{color:var(--red);font-weight:700}
.sheetdemo .yes{color:var(--green);font-weight:700}
.faq{border-bottom:1px solid var(--line)}
.faq:last-child{border-bottom:0}
.faq summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:'▸';color:var(--blue);margin-right:8px;display:inline-block;transition:.15s}
.faq[open] summary::before{transform:rotate(90deg)}
.faq .a{padding:0 0 14px 20px;color:var(--muted)}
</style>
<script src="assets/common.js"></script>
</head>

      <div class="a">ถ้าอัปผิดชนิด (เช่นไฟล์ยอดขายแต่เลือกเป็นค่าใช้จ่าย) ไปหน้านำเข้าข้อมูล

        ถ้าแค่ตัวเลขในไฟล์ผิด ให้แก้ไฟล์แล้วอัปซ้ำได้เลย ไม่ต้องล้าง</div></details>

    <details class="faq"><summary>อัปไฟล์ซ้ำแล้วยอดจะเบิ้ลไหม</summary>
      <div class="a">ไม่เบิ้ล ระบบสร้างรหัสประจำแถวจากเนื้อหา แถวเดิมจะถูกเขียนทับ
        ยกเว้นกรณีเดียวคือติ๊กชีทที่ซ้ำกันในไฟล์ค่าใช้จ่าย (ACC กับ Ads เดือน 2–7) เข้าไปพร้อมกัน</div></details>

    <details class="faq"><summary>เพื่อนอัปข้อมูลใหม่แล้ว แต่หน้าจอผมยังเป็นตัวเลขเก่า</summary>
      <div class="a">ระบบเก็บผลไว้ 10 นาทีเพื่อให้สลับหน้าเร็ว กดปุ่ม <b>↻ รีเฟรช</b> มุมขวาบน
        จะดึงตัวเลขล่าสุดทันที</div></details>

    <details class="faq"><summary>ทำไมยอดในระบบไม่ตรงกับที่ดูใน Shopee Seller Centre</summary>
      <div class="a">ระบบใช้ยอดจากไฟล์ที่ส่งออกมาเท่านั้น ตัวเลขจะตรงกับไฟล์เสมอ
        ถ้าไม่ตรงกับ Seller Centre ให้เช็คว่าไฟล์ที่ส่งออกครอบคลุมช่วงวันที่และร้านครบหรือยัง
        และดูที่ประวัติการนำเข้าว่ามีแถวถูกข้ามหรือเปล่า</div></details>

    <details class="faq"><summary>ผู้ดูแลบางคนหายไปจากรายการ</summary>
      <div class="a">รายชื่อผู้ดูแลมาจากข้อมูลยอดขายที่มีอยู่ ถ้าคนนั้นยังไม่มียอดในช่วงที่กรอง
        จะไม่ขึ้นในตัวกรอง ลองเปลี่ยนเดือนหรือเลือก "ทั้งปี" ดู</div></details>

    <details class="faq"><summary>อยากได้ข้อมูลไปทำต่อใน Excel</summary>
      <div class="a">กดปุ่ม <b>⬇ Excel</b> บนตารางที่ต้องการ ระบบจะส่งออกเฉพาะแถวที่กรองและค้นหาไว้
        ตารางรายวันต่อบุคคลก็ส่งออกได้ ได้เป็นตารางไขว้พร้อมยอดรวม</div></details>

    <details class="faq"><summary>ทำไมผมไม่เห็นเมนู "นำเข้าข้อมูล"</summary>
      <div class="a">บัญชีของคุณเป็นระดับ Shopee ซึ่งดูข้อมูลและส่งออก Excel ได้ แต่แก้ข้อมูลไม่ได้
        ถ้าต้องอัปโหลดไฟล์ ให้แจ้งหัวหน้าทีมปรับสิทธิ์ให้</div></details>

    <details class="faq"><summary>เข้าสู่ระบบแล้วขึ้นว่า "ยังไม่ได้ตั้งระดับสิทธิ์"</summary>
      <div class="a">บัญชีสมัครไว้แล้วแต่ยังไม่ได้ผูกระดับสิทธิ์ ให้เลือกระดับแล้วใส่รหัสเชิญที่ขอจากหัวหน้าทีม
        ใส่ครั้งเดียวจบ ครั้งต่อไปเข้าได้เลย</div></details>

    <details class="faq"><summary>ลืมรหัสผ่าน</summary>
      <div class="a">แจ้งผู้ดูแลระบบให้รีเซ็ตให้จากหน้า Authentication ของ Supabase</div></details>

    <details class="faq"><summary>เปิดในมือถือได้ไหม</summary>
      <div class="a">ได้ หน้าจอปรับตามขนาดอัตโนมัติ กดปุ่ม ☰ มุมซ้ายบนเพื่อเปิดเมนู
        ตารางกว้าง ๆ เลื่อนซ้ายขวาได้</div></details>
  </div></div>

      แล้วส่งให้ฝ่ายพัฒนาองค์กรด้าน AI</p>
    <p style="color:var(--muted);font-size:12.5px">ถ้าเป็นเรื่องยอดเงินหรือสัญญา ให้ติดต่อทีมขายส่งหรือ Sale Admin โดยตรง</p>

function render(){
  const body = { start:S_START, import:S_IMPORT, read:S_READ, faq:S_FAQ }[TAB];
  $('#view').innerHTML = tabBar(TABS, TAB, 'setTab') + body;
}

(async function(){
  if (!requireAuth()) return;
  if (!SB.role()){ try { await SB.loadRole(); } catch (e) {} }
  shell('help', 'วิธีใช้งาน', 'คู่มือระบบข้อมูลทีม Shopee');
  const b = $('#refreshBtn'); if (b) b.remove();   // หน้านี้ไม่ได้ดึงข้อมูล
  render();
})();
</script>
