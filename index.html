<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASARU · ระบบทีม Shopee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/common.js"></script>
</head>
<body>
<div id="root"></div>
<script>
/* ================= เข้าสู่ระบบ ================= */
function loginScreen(mode){
  const signup = mode === 'signup';
  document.getElementById('root').innerHTML = `
  <div class="login-wrap"><div class="login">
    <div class="mark">MASARU<span>·</span>Shopee</div>
    <div class="sub">${signup ? 'สร้างบัญชีใหม่สำหรับทีม Shopee' : 'ระบบข้อมูลทีม Shopee — เข้าสู่ระบบเพื่อใช้งาน'}</div>
    <div class="fld"><label>อีเมล</label><input id="em" type="email" autocomplete="username" placeholder="you@masaru.co.th"></div>
    <div class="fld"><label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'อย่างน้อย 6 ตัวอักษร':'รหัสผ่าน'}"></div>
    ${signup ? `<div class="fld"><label>รหัสเชิญของทีม</label><input id="iv" placeholder="ขอจากหัวหน้าทีม"></div>` : ''}
    <div id="msg" style="margin-bottom:12px"></div>
    <button class="btn p" id="go">${signup ? 'สร้างบัญชี' : 'เข้าสู่ระบบ'}</button>
    <div class="alt">${signup
      ? 'มีบัญชีอยู่แล้ว? <a onclick="loginScreen(\'signin\')">เข้าสู่ระบบ</a>'
      : 'ยังไม่มีบัญชี? <a onclick="loginScreen(\'signup\')">สร้างบัญชีใหม่</a>'}</div>
  </div></div>`;
  const msg = (t, k) => document.getElementById('msg').innerHTML =
    `<div class="${k === 'ok' ? 'okbox' : 'err'}">${esc(t)}</div>`;
  const submit = async () => {
    const btn = document.getElementById('go');
    const email = document.getElementById('em').value.trim();
    const pw = document.getElementById('pw').value;
    if (!email || !pw) return msg('กรอกอีเมลและรหัสผ่านให้ครบ');
    btn.disabled = true; btn.textContent = 'กำลังดำเนินการ…';
    try {
      if (signup){
        if (document.getElementById('iv').value.trim() !== INVITE_CODE)
          throw new Error('รหัสเชิญไม่ถูกต้อง — ขอรหัสจากหัวหน้าทีม');
        await SB.signUp(email, pw);
        msg('สร้างบัญชีแล้ว หากระบบเปิดยืนยันอีเมล ให้กดลิงก์ในอีเมลก่อนเข้าสู่ระบบ', 'ok');
        btn.disabled = false; btn.textContent = 'สร้างบัญชี';
        return;
      }
      await SB.signIn(email, pw);
      location.reload();
    } catch (e) {
      msg(e.message);
      btn.disabled = false; btn.textContent = signup ? 'สร้างบัญชี' : 'เข้าสู่ระบบ';
    }
  };
  document.getElementById('go').onclick = submit;
  document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

/* ================= หน้าหลัก ================= */
let DATA = null;

async function loadHome(){
  const v = $('#view');
  v.innerHTML = loading('กำลังดึงข้อมูลจากฐานข้อมูลทีม…');
  const R = filterRange();
  const owner = FILTER.owner === 'all' ? null : FILTER.owner;
  const store = FILTER.store === 'all' ? null : FILTER.store;
  try {
    const [daily, monthly, storeRows, exp, off] = await Promise.all([
      SB.rpcCached('f_sales_daily',   { p_from: R.from, p_to: R.to, p_owner: owner, p_store: store }),
      SB.rpcCached('f_sales_monthly', { p_from: `${yearOf()}-01-01`, p_to: `${yearOf()}-12-31`, p_owner: owner, p_store: store }),
      SB.rpcCached('f_sales_store',   { p_from: R.from, p_to: R.to, p_owner: owner }),
      SB.selectCached('shopee_expense', `select=pay_date,category,owner,amount&pay_date=gte.${yearOf()}-01-01&pay_date=lte.${yearOf()}-12-31${owner ? `&owner=eq.${encodeURIComponent(owner)}` : ''}`),
      SB.selectCached('shopee_offsys',  `select=rec_date,owner,total&rec_date=gte.${R.from}&rec_date=lte.${R.to}${owner ? `&owner=eq.${encodeURIComponent(owner)}` : ''}`)
    ]);
    DATA = { daily, monthly, storeRows, exp, off };
    renderHome();
  } catch (e) { v.innerHTML = errBox(e); }
}
function yearOf(){ return FILTER.year === 'all' ? (RANGE.sales ? yOf(RANGE.sales.dmax) : new Date().getFullYear()) : +FILTER.year; }

function renderHome(){
  destroyCharts(); resetTables();
  const { daily, monthly, storeRows, exp, off } = DATA;
  const net    = daily.reduce((a, r) => a + +r.net, 0);
  const orders = daily.reduce((a, r) => a + +r.orders, 0);
  const qty    = daily.reduce((a, r) => a + +r.qty, 0);
  const aov    = orders ? net / orders : 0;

  const inRange = r => String(r.pay_date) >= filterRange().from && String(r.pay_date) <= filterRange().to;
  const expIn   = exp.filter(inRange);
  const expTot  = expIn.reduce((a, r) => a + +r.amount, 0);
  const adsTot  = expIn.filter(r => /ads/i.test(r.category || '')).reduce((a, r) => a + +r.amount, 0);
  const offTot  = off.reduce((a, r) => a + +r.total, 0);

  const saleByMonth = new Map();
  monthly.forEach(r => saleByMonth.set(r.ym, (saleByMonth.get(r.ym) || 0) + +r.net));
  const ov = overlap(saleByMonth, expIn);
  const expMonths = new Set(expIn.map(r => String(r.pay_date).slice(0, 7))).size;

  // เทียบเดือนก่อนหน้า
  let mom = `${num(new Set(daily.map(r => r.d)).size)} วันที่มียอด`;
  if (FILTER.month !== 'all'){
    const y = yearOf(), m = +FILTER.month;
    const prevKey = `${m === 1 ? y - 1 : y}-${String(m === 1 ? 12 : m - 1).padStart(2, '0')}`;
    const pn = saleByMonth.get(prevKey) || 0;
    if (pn > 0){
      const g = (net - pn) / pn * 100;
      mom = `<span class="${g >= 0 ? 'up' : 'down'}">${g >= 0 ? '▲' : '▼'} ${nf2.format(Math.abs(g))}%</span> จาก ${TH_MON_S[m === 1 ? 12 : m - 1]}`;
    }
  }

  const days = [...new Set(daily.map(r => r.d))].sort();
  const dayNet = days.map(d => daily.filter(r => r.d === d).reduce((a, r) => a + +r.net, 0));
  const avgDay = dayNet.length ? dayNet.reduce((a, b) => a + b, 0) / dayNet.length : 0;

  const mSale = Array(13).fill(0), mExp = Array(13).fill(0);
  monthly.forEach(r => mSale[+r.ym.slice(5, 7)] += +r.net);
  exp.forEach(r => mExp[mOf(r.pay_date)] += +r.amount);
  const usedM = [...Array(13).keys()].slice(1).filter(i => mSale[i] || mExp[i]);

  const byOwner = [...groupBy(daily, r => r.owner)]
    .map(([k, v]) => ({ k, net: v.reduce((a, r) => a + +r.net, 0), ord: v.reduce((a, r) => a + +r.orders, 0) }))
    .sort((a, b) => b.net - a.net);
  const topStores = storeRows.slice(0, 8);

  const modStat = {
    sales:   [`${num(orders)} ออเดอร์`, money(net)],
    offsys:  [`${num(off.length)} รายการ`, money(offTot)],
    expense: [`${num(expIn.length)} รายการ`, money(expTot)],
    import:  ['อัปเดตล่าสุด', RANGE.sales && RANGE.sales.dmax ? thDate(RANGE.sales.dmax) : '—'],
    help:    ['เปิดครั้งแรก อ่านตรงนี้', 'คู่มือ 4 หัวข้อ']
  };
  const cards = MODULES.filter(m => m.id !== 'index').map(m => `
    <a class="mod" href="${m.file}">
      <div class="mic">${m.ic}</div>
      <h4>${esc(m.t)}</h4><p>${esc(m.d)}</p>
      <div class="stat"><span>${esc(modStat[m.id][0])}</span><b>${esc(modStat[m.id][1])}</b></div>
    </a>`).join('');

  $('#view').innerHTML = `
    <div class="kpis">
      ${kpi('ยอดขายสุทธิ', money(net), mom, 'n')}
      ${kpi('จำนวนออเดอร์', num(orders), `${num(qty)} ชิ้น`, '')}
      ${kpi('เฉลี่ยต่อออเดอร์', money(aov), 'AOV', 'ok')}
      ${kpi('ค่าใช้จ่ายรวม', money(expTot), `ค่า Ads ${money(adsTot)}`, 'g')}
      ${kpi('สัดส่วน Ads / ยอดขาย', ov.ratio == null ? '—' : nf2.format(ov.ratio) + '%',
            ov.ratio == null ? 'ยังไม่มีเดือนที่เทียบได้' : (ov.partial ? 'เทียบได้เฉพาะ ' : '') + ov.label,
            ov.ratio == null || ov.partial ? 'g' : (ov.ratio > 25 ? 'r' : 'ok'))}
      ${kpi('รายรับนอกระบบ', money(offTot), `${num(off.length)} รายการ`, 'r')}
    </div>
    ${overlapNote(ov, expMonths)}

    <div class="panel"><div class="panel-h"><h3>ระบบย่อย</h3>
      <span class="hint">เลือกระบบที่ต้องการใช้งาน</span></div>
      <div class="panel-b"><div class="mods">${cards}</div></div></div>

    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>ยอดขายรายวันทั้งทีม</h3>
        <span class="hint">เฉลี่ย ${money(avgDay)}/วัน</span></div>
        <div class="panel-b"><div class="chartbox"><canvas id="cDay"></canvas></div></div></div>
      <div class="panel"><div class="panel-h"><h3>ยอดขาย vs ค่าใช้จ่าย รายเดือน</h3>
        <span class="hint">ปี ${beYear(yearOf())}</span></div>
        <div class="panel-b"><div class="chartbox"><canvas id="cMon"></canvas></div></div></div>
    </div>

    <div class="grid2">
      <div class="panel"><div class="panel-h"><h3>ยอดขายรายบุคคล</h3></div>
        <div class="panel-b"><div class="chartbox sm"><canvas id="cOwner"></canvas></div></div></div>
      <div class="panel"><div class="panel-h"><h3>สัดส่วนร้านค้า (8 อันดับแรก)</h3></div>
        <div class="panel-b"><div class="chartbox sm"><canvas id="cStore"></canvas></div></div></div>
    </div>

    ${renderTable([
      { t:'#', fmt:(r,i)=>`<span class="rank">${i+1}</span>`, w:5 },
      { t:'ผู้ดูแล', k:'k', w:14 },
      { t:'ยอดขายสุทธิ', num:true, bar:true, sum:true, raw:r=>r.net, fmt:r=>money(r.net), w:16 },
      { t:'ออเดอร์', num:true, sum:true, raw:r=>r.ord, fmt:r=>num(r.ord), sumFmt:num, w:12 },
      { t:'เฉลี่ย/ออเดอร์', num:true, raw:r=>r.ord?r.net/r.ord:0, fmt:r=>money(r.ord?r.net/r.ord:0), w:14 },
      { t:'สัดส่วน', num:true, raw:r=>net?r.net/net*100:0, fmt:r=>nf2.format(net?r.net/net*100:0)+'%', w:10 }
    ], byOwner, { title:'สรุปผลงานรายบุคคล', total:true, sort:2, download:'สรุปผลงานรายบุคคล' })}`;

  paintAllTables();
  chart('cDay', barCfg(days.map(d => `${dOf(d)} ${TH_MON_S[mOf(d)]}`),
    [{ label:'ยอดขายสุทธิ', data:dayNet, backgroundColor:C.blue, borderRadius:4, maxBarThickness:34 }]));
  chart('cMon', barCfg(usedM.map(i => TH_MON_S[i]), [
    { label:'ยอดขาย', data:usedM.map(i => mSale[i]), backgroundColor:C.navy, borderRadius:4, maxBarThickness:38 },
    { label:'ค่าใช้จ่าย', data:usedM.map(i => mExp[i]), backgroundColor:C.gold, borderRadius:4, maxBarThickness:38 }]));
  chart('cOwner', barCfg(byOwner.map(o => o.k),
    [{ label:'ยอดขาย', data:byOwner.map(o => o.net), backgroundColor:C.navy, borderRadius:4, maxBarThickness:44 }]));
  chart('cStore', doughnutCfg(topStores.map(s => s.store), topStores.map(s => +s.net)));
}

function onFilterChange(){ renderFilters(); loadHome(); }

(async function boot(){
  if (!SB.token()){ loginScreen('signin'); return; }
  shell('index', 'หน้าหลัก', '');
  try {
    await loadDims();
  } catch (e) {
    if (/JWT|token|401/i.test(e.message)){ SB.signOut(); return; }
    $('#view').innerHTML = errBox(e); return;
  }
  renderFilters();
  if (!RANGE.sales || !RANGE.sales.rows){
    $('#view').innerHTML = emptyState('ยังไม่มีข้อมูลในระบบ',
      'อัปโหลดไฟล์ Excel ยอดขาย ค่าใช้จ่าย และรายรับนอกระบบ เพื่อเริ่มใช้งาน — ถ้ายังไม่แน่ใจว่าต้องอัปไฟล์ไหน อ่านหน้าวิธีใช้งานก่อนได้',
      'ไปหน้านำเข้าข้อมูล');
    return;
  }
  loadHome();
})();
</script>
</body>
</html>
